plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'co.sierraclara.gemmalitertlm'
version = '0.1.0'

android {
  namespace "co.sierraclara.gemmalitertlm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  kotlinOptions {
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}

dependencies {
  implementation "com.google.ai.edge.litertlm:litertlm-android:0.16.0"
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'co.sierraclara.capturequalityproxy'
version = '0.1.0'

android {
  namespace "co.sierraclara.capturequalityproxy"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.4.1"
}

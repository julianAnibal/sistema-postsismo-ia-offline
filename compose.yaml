services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 1000_ojos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ojos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 1000_ojos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ojos_postgres:

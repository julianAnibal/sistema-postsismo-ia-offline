[project]
name = "sistema-postsismo-ml-validation"
version = "0.1.0"
description = "Dependencias reproducibles para validar el arnes ML offline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.25,<5",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11.2,<13",
]

[project.optional-dependencies]
capture-quality = [
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "psutil>=7,<8",
  "torch>=2.7,<3",
]

[tool.uv]
package = false
